<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b20">
<title>ASCII KOI POND — 字元錦鯉池</title>
<style>
:root{color-scheme:dark;--bg:#0b1b20;--fg:#e9eee8;--muted:#9bb0ad;--stroke:rgba(219,239,227,.17);--glass:rgba(10,27,31,.75);--accent:#eebf8b}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans TC",monospace;background:var(--bg);color:var(--fg);overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 72% 45%,#183239 0%,#0f252b 41%,#09191f 100%);touch-action:manipulation;cursor:crosshair}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,rgba(170,222,223,.23) .7px,transparent 1px);background-size:25px 25px;mask-image:linear-gradient(130deg,transparent,#000 40%,#000 75%,transparent)}
#pond{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(5,17,21,.56),transparent 21%,transparent 78%,rgba(5,17,21,.64));}
header{position:absolute;z-index:2;left:clamp(20px,5vw,70px);top:clamp(25px,5vh,62px);right:clamp(20px,5vw,70px);display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.brand .tag{font-size:11px;letter-spacing:.22em;color:var(--accent);margin-bottom:15px}.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,5.2vw,72px);font-weight:400;letter-spacing:-.055em;line-height:.93}.brand h1 em{font-style:italic;color:#ecc7a3}.brand small{display:block;margin-top:16px;color:var(--muted);font-size:12px;letter-spacing:.09em}
.right{border:1px solid var(--stroke);background:var(--glass);border-radius:12px;padding:12px 15px;backdrop-filter:blur(12px);font-size:11px;color:var(--muted);letter-spacing:.08em;line-height:1.8}.right strong{display:block;color:var(--fg);font-size:17px;font-weight:500;letter-spacing:0;font-variant-numeric:tabular-nums}
footer{position:absolute;z-index:2;bottom:clamp(22px,5vh,58px);left:clamp(20px,5vw,70px);right:clamp(20px,5vw,70px);display:flex;justify-content:space-between;align-items:end;gap:15px;pointer-events:none}
.instructions{font-size:12px;line-height:1.9;color:var(--muted)}.instructions b{color:#e4e5d9;font-weight:500}.buttons{display:flex;gap:9px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;font-size:12px;letter-spacing:.04em;color:var(--fg);border:1px solid rgba(215,239,232,.3);padding:12px 16px;border-radius:999px;background:rgba(12,32,37,.78);backdrop-filter:blur(14px);cursor:pointer;transition:background .15s,transform .15s}button:hover{background:rgba(36,66,69,.9);transform:translateY(-2px)}button:active{transform:scale(.96)}button.primary{color:#15242a;background:#e7cfaa;border-color:#e7cfaa;font-weight:600}button.primary:hover{background:#f4dcbc}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.12em;background:rgba(6,22,28,.78);padding:10px 17px;border:1px solid var(--stroke);border-radius:8px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:2}
#legend{position:absolute;right:clamp(20px,5vw,70px);top:46%;transform:translateY(-50%);writing-mode:vertical-rl;letter-spacing:.5em;opacity:.36;font-size:12px;pointer-events:none}
@media(max-width:640px){.brand h1{font-size:38px}.brand small{font-size:10px;max-width:220px;line-height:1.6}.right{padding:8px 10px;font-size:9px}.right strong{font-size:15px}footer{align-items:stretch;flex-direction:column}.instructions{font-size:11px}.buttons{justify-content:flex-start}button{padding:11px 14px}#legend{display:none}header{top:24px}footer{bottom:max(18px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
header{top:max(20px,env(safe-area-inset-top))}button{min-height:44px}footer{bottom:max(20px,env(safe-area-inset-bottom))}@media(max-height:500px){.brand h1{font-size:26px}.brand small,.brand .tag,.instructions{display:none}header{top:12px}footer{bottom:max(10px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div id="stage"><canvas id="pond" aria-label="互動 ASCII 錦鯉池。點擊水面餵魚。"></canvas><div class="shade"></div></div>
<header><div class="brand"><div class="tag">[ INTERACTIVE / 001 ]</div><h1>ASCII<br><em>Koi Pond.</em></h1><small>一池字元，一點漣漪。<br>每條魚都是即時繪製的文字。</small></div><div class="right">POND STATUS<strong><span id="fishCount">6</span> koi · <span id="foodCount">0</span> food</strong>已吃掉 <span id="eatenCount">0</span> 顆</div></header>
<div id="legend">錦鯉游於字裡行間</div>
<footer><div class="instructions"><b>↗ 點擊水面</b>，撒下飼料 · <b>移動滑鼠</b>，與魚互動<br>純 Canvas + JavaScript · 無圖片、無依賴</div><div class="buttons"><button class="primary" id="feed">＋ 餵食</button><button id="add">＋ 加一條魚</button><button id="clear">↺ 重置</button></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('pond'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage');
const fishEl=document.getElementById('fishCount'),foodEl=document.getElementById('foodCount'),toastEl=document.getElementById('toast');
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
let W=innerWidth,H=innerHeight,dpr=1,time=0,last=performance.now(),nextId=1,toastTimer=0;
let fish=[],food=[],ripples=[],eaten=0,raf=0;
const eatenEl=document.getElementById("eatenCount");
const looks=[
 {name:'Kohaku',white:'#f2e9d9',red:'#ef795e',dark:'#203039',pattern:0},
 {name:'Sanke',white:'#f3e7d7',red:'#e8705c',dark:'#23363b',pattern:1},
 {name:'Ogon',white:'#e8c985',red:'#ffdca3',dark:'#7c5e3a',pattern:2},
 {name:'Showa',white:'#dde2d8',red:'#ef8666',dark:'#314048',pattern:3},
 {name:'Platinum',white:'#eff3e9',red:'#cddfcf',dark:'#73858a',pattern:4}
];
function resize(){const oldW=W,oldH=H;W=stage.clientWidth;H=stage.clientHeight;if(fish.length){for(const f of fish){f.x=f.x/oldW*W;f.y=f.y/oldH*H}for(const p of food){p.x=p.x/oldW*W;p.y=p.y/oldH*H}}dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function addFish(x=rand(W*.2,W*.8),y=rand(H*.2,H*.8)){
 const len=rand(120,177)*(W<600?.77:1),angle=rand(-Math.PI,Math.PI);
 fish.push({id:nextId++,x,y,len,angle,speed:rand(24,38),cruise:rand(22,34),phase:rand(0,TAU),turn:rand(-.3,.3),wander:rand(1,4),look:looks[Math.floor(Math.random()*looks.length)],seed:rand(0,20)});
 fishEl.textContent=fish.length;
}
function reset(){fish=[];food=[];ripples=[];nextId=1;eaten=0;eatenEl.textContent=0;const count=W<600?4:6;for(let i=0;i<count;i++){const x=W<600?W*(i%2?.72:.30):W*(.25+.55*h(i,6.2));const y=H*(.23+.54*(i+.5)/count);addFish(x,y)}foodEl.textContent='0'}
function feed(x,y){
 for(let j=0;j<6;j++){const a=rand(0,TAU),r=rand(5,36);food.push({x:clamp(x+Math.cos(a)*r,10,W-10),y:clamp(y+Math.sin(a)*r,10,H-10),age:0,life:rand(18,25),phase:rand(0,TAU)})}
 if(food.length>100)food.splice(0,food.length-100);ripples.push({x,y,age:0,max:85});foodEl.textContent=food.length;
}
let pointer={x:-500,y:-500,lastX:-500,lastY:-500,speed:0,active:false};
function movePointer(x,y){const s=Math.hypot(x-pointer.x,y-pointer.y);pointer.speed=pointer.active?s*25:0;pointer.x=x;pointer.y=y;pointer.active=true}
function update(dt){
 time+=dt;pointer.speed*=Math.exp(-dt*5);
 food.forEach(p=>{p.age+=dt;p.y+=Math.sin(p.phase+time)*dt*.45});food=food.filter(p=>p.age<p.life);foodEl.textContent=food.length;
 ripples.forEach(r=>r.age+=dt);ripples=ripples.filter(r=>r.age<2.3);
 for(let i=0;i<fish.length;i++){
  const f=fish[i];f.phase+=dt*(2.7+f.speed*.035);f.wander-=dt;
  if(f.wander<=0){f.wander=rand(1.5,3.5);f.turn=rand(-.75,.75)}
  let dx=Math.cos(f.angle)+Math.cos(f.angle+f.turn)*.35,dy=Math.sin(f.angle)+Math.sin(f.angle+f.turn)*.35;
  let target=null,best=Infinity;
  for(const p of food){const d=dist(f,p);if(d<best){best=d;target=p}}
  if(target){dx=(target.x-f.x);dy=(target.y-f.y);if(best<f.len*.26){food.splice(food.indexOf(target),1);eatenEl.textContent=++eaten;foodEl.textContent=food.length;ripples.push({x:target.x,y:target.y,age:0,max:26})}}
  const safe=Math.min(85,W*.16,H*.16);
  if(f.x<safe)dx+=(safe-f.x)*3;
  if(f.x>W-safe)dx-=(f.x-(W-safe))*3;
  if(f.y<safe)dy+=(safe-f.y)*3;
  if(f.y>H-safe)dy-=(f.y-(H-safe))*3;
  for(const other of fish){if(other===f)continue;const dd=dist(f,other);if(dd<80&&dd>0){dx+=(f.x-other.x)/dd*25;dy+=(f.y-other.y)/dd*25}}
  const pd=Math.hypot(pointer.x-f.x,pointer.y-f.y);
  if(pointer.active&&pointer.speed>220&&pd<115&&pd>0&&!target){dx+=(f.x-pointer.x)/pd*180;dy+=(f.y-pointer.y)/pd*180}
  const desired=Math.atan2(dy,dx),delta=wrap(desired-f.angle);
  f.angle+=clamp(delta,-dt*1.2,dt*1.2);
  const goal=target?randless(f,54,65):f.cruise;
  f.speed+=(goal-f.speed)*Math.min(1,dt*1.5);
  f.x+=Math.cos(f.angle)*f.speed*dt;f.y+=Math.sin(f.angle)*f.speed*dt;
  f.x=clamp(f.x,-30,W+30);f.y=clamp(f.y,-30,H+30);
 }
}
function randless(f,a,b){return a+(Math.sin(f.seed)*.5+.5)*(b-a)}
function h(x,y,z=0){const v=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return v-Math.floor(v)}
function rgba(hex,opacity){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${opacity})`}
function glyphAt(x,y,glyph,color,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillText(glyph,x,y)}
// The fish are drawn entirely from characters. Each screen cell is mapped back to fish-body space.
function koiGlyph(f){
 const L=f.len,c=Math.cos(f.angle),s=Math.sin(f.angle),cw=7.5,ch=9.5;
 const x0=Math.floor((f.x-L*.97)/cw),x1=Math.ceil((f.x+L*.97)/cw),y0=Math.floor((f.y-L*.97)/ch),y1=Math.ceil((f.y+L*.97)/ch);
 const patches=f.look;
 for(let iy=y0;iy<=y1;iy++)for(let ix=x0;ix<=x1;ix++){
  const px=ix*cw+cw*.5,py=iy*ch+ch*.5,rx=px-f.x,ry=py-f.y;
  const lx=(rx*c+ry*s)/L,ly=(-rx*s+ry*c)/L;
  const bend=Math.sin(f.phase+lx*7)*Math.max(0,.23-lx)*.06;
  const yy=ly-bend;
  const t=(lx+.57)/1.12,thickness=t>0&&t<1?Math.pow(Math.sin(t*Math.PI),.75)*.205:0;
  const body=t>0&&t<1&&Math.abs(yy)<thickness;
  const tailA=((lx+.72)/.22)**2+((yy-.135)/.13)**2<1;
  const tailB=((lx+.72)/.22)**2+((yy+.135)/.13)**2<1;
  const finA=((lx+.11)/.20)**2+((yy-.245)/.105)**2<1;
  const finB=((lx+.11)/.20)**2+((yy+.245)/.105)**2<1;
  if(!body&&!tailA&&!tailB&&!finA&&!finB)continue;
  const n=h(Math.floor(lx*28),Math.floor(yy*40),f.id),col=body?Math.abs(yy)/(thickness||1):1;
  let glyph=body?'t%SX8@#'[Math.min(6,Math.floor(n*7))]:'.:;t%S'[Math.min(4,Math.floor(n*5))];
  let color=patches.white,alpha=.9;
  if(body){
   const patch=Math.sin(lx*21+f.seed)*Math.cos(yy*20+f.seed*.64)+Math.sin(lx*39-yy*14+f.seed)*.32;
   const red=patch>.18&&lx<.28;
   const black=patches.pattern===1&&Math.sin(lx*57+yy*35+f.seed)> .83 || patches.pattern===3 && Math.sin(lx*35-yy*30+f.seed)> .18;
   if(red)color=patches.red;
   if(black)color=patches.dark;
   if(patches.pattern===4)color=n>.68?'#ffffff':patches.white;
   if(col>.78){glyph='.:;+'[Math.floor(n*4)];alpha=.75}
   if(lx>.33&&Math.abs(yy)>.042&&Math.abs(yy)<.13){glyph='o';color='#202a2c';alpha=1}
   if(lx>.4&&Math.abs(yy)<.035)glyph=':';
  }else{color=patches.pattern===2?patches.white:patches.red;alpha=.72}
  // offset copies make a typographic shadow without using bitmap fish assets
  glyphAt(px+3,py+5,glyph,'#020b0e',.22);
  glyphAt(px,py,glyph,color,alpha);
 }
}
function render(){
 ctx.clearRect(0,0,W,H);
 ctx.font=`500 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
 ctx.textAlign='center';ctx.textBaseline='middle';
 // Glints from imagined currents, represented as occasional symbols.
 for(let i=0;i<46;i++){
  let x=(h(i,21)*W+Math.sin(time*.19+i)*15+W)%W,y=(h(i,46)*H+time*(2+i%4))%H;
  glyphAt(x,y,i%5===0?'~':i%3===0?'·':'.','#7aabb0',.09+(Math.sin(time*1.3+i)*.5+.5)*.07);
 }
 for(const r of ripples){const rad=(r.age/2.3)*r.max*1.6,fade=(1-r.age/2.3)*.45;for(let a=0;a<TAU;a+=.24){const x=r.x+Math.cos(a)*rad,y=r.y+Math.sin(a)*rad;glyphAt(x,y,Math.sin(a*8)>0?'.':'·','#b3d6cc',fade)}}
 for(const p of food){const pulse=.7+Math.sin(time*6+p.phase)*.17;glyphAt(p.x,p.y,'•','#e9c691',pulse);glyphAt(p.x+1,p.y+10,'.','#e9c691',.18)}
 const order=[...fish].sort((a,b)=>a.len-b.len);for(const f of order)koiGlyph(f);
 ctx.globalAlpha=1;
}
function frame(now){const dt=Math.min(.035,(now-last)/1000||.016);last=now;update(dt);render();if(!document.hidden)raf=requestAnimationFrame(frame)}
function centerFeed(){feed(W*.52,H*.52);say('飼料已撒入水中')}
function say(message){toastEl.textContent=message;toastEl.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.style.opacity='0',1100)}
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();e.pointerType==='mouse'&&movePointer(e.clientX-r.left,e.clientY-r.top)},{passive:true});
canvas.addEventListener('pointerleave',()=>pointer.active=false);
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();feed(e.clientX-r.left,e.clientY-r.top)});
document.getElementById('feed').addEventListener('click',centerFeed);
document.getElementById('add').addEventListener('click',()=>{if(fish.length>=15){say('最多 15 條錦鯉');return}addFish();say('新錦鯉入池！')});
document.getElementById('clear').addEventListener('click',()=>{reset();say('池塘已重置')});
addEventListener('resize',resize);resize();reset();render();raf=requestAnimationFrame(frame);
document.addEventListener("visibilitychange",()=>{cancelAnimationFrame(raf);last=performance.now();if(!document.hidden)raf=requestAnimationFrame(frame)});
new ResizeObserver(()=>{resize();render()}).observe(stage);
})();
</script>
</body>
</html>
